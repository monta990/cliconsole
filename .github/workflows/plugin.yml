name: Plugin Structure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cliconsole-plugin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: GLPI plugin metadata and structure
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up PHP with XML support
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.5'
          extensions: simplexml
          tools: none
          coverage: none

      - name: Validate plugin manifest, version, compatibility, and required files
        run: php .github/scripts/validate-plugin.php
