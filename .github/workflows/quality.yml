name: Code Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cliconsole-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PSR-12 coding style
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up PHP and PHP_CodeSniffer
        uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.5'
          extensions: none
          tools: phpcs:4.0.4
          coverage: none
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce PSR-12 on CI test utilities
        run: phpcs --standard=PSR12 --extensions=php --report=full --warning-severity=0 .github/scripts || true
